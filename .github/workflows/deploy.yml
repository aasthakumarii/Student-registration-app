name: Student Registration App CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select Action"
        required: true
        type: choice
        options:
          - create
          - destroy

jobs:

  terraform-create:
    if: github.event.inputs.action == 'create'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    outputs:
      ec2_ip: ${{ steps.ec2.outputs.ec2_ip }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Get EC2 IP
        id: ec2
        run: |
          echo "ec2_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

      - name: Show Outputs
        run: terraform output

  deploy:
    if: github.event.inputs.action == 'create'

    needs: terraform-create

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login To Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Image
        run: |
          docker build \
          -t ${{ steps.login-ecr.outputs.registry }}/student-backend:latest \
          ./backend

      - name: Build Frontend Image
        run: |
          docker build \
          -t ${{ steps.login-ecr.outputs.registry }}/student-frontend:latest \
          ./frontend

      - name: Push Backend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/student-backend:latest

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/student-frontend:latest

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/student-backend:latest
          severity: CRITICAL
          ignore-unfixed: true

      - name: Copy Docker Compose File
        uses: appleboy/scp-action@master
        with:
          host: ${{ needs.terraform-create.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker/docker-compose.ec2.yml"
          target: "/home/ubuntu"
          strip_components: 1

      - name: Deploy To EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.terraform-create.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |

            aws ecr get-login-password \
            --region ${{ secrets.AWS_REGION }} | \
            sudo docker login \
            --username AWS \
            --password-stdin \
            ${{ steps.login-ecr.outputs.registry }}

            sudo docker pull \
            ${{ steps.login-ecr.outputs.registry }}/student-backend:latest

            sudo docker pull \
            ${{ steps.login-ecr.outputs.registry }}/student-frontend:latest

            sudo docker compose \
            -f /home/ubuntu/docker-compose.ec2.yml \
            down || true

            sudo docker compose \
            -f /home/ubuntu/docker-compose.ec2.yml \
            up -d

      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.terraform-create.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker ps

      - name: Show URL
        run: |
          echo "Application deployed successfully"
          echo "http://${{ needs.terraform-create.outputs.ec2_ip }}"

  terraform-destroy:
    if: github.event.inputs.action == 'destroy'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve