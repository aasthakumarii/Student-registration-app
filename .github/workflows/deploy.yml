name: Deploy Student Registration App

on:
  push:
    branches: ["main"]

permissions:
  issues: write
  contents: read

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code (Fix for Gitleaks)
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          cd backend
          npm install

      # 4. Dependency Scan
      - name: npm Audit
        run: |
          cd backend
          npm audit --audit-level=high || true

      # 5. Docker Login
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 6. Build & Push Images
      - name: Build and Push Images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/student-backend:latest ./backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/student-frontend:latest ./frontend

          docker push ${{ secrets.DOCKER_USERNAME }}/student-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/student-frontend:latest

      # 7. Trivy Scan (Container)
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/student-backend:latest
          severity: CRITICAL
          ignore-unfixed: true

      # 8. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/Student-registration-app-

            docker pull ${{ secrets.DOCKER_USERNAME }}/student-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/student-frontend:latest

            docker-compose -f docker-compose.ec2.yml down
            docker-compose -f docker-compose.ec2.yml up -d

      # 9. Verify Containers
      - name: Verify Containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "📦 Running Containers:"
            docker ps

      # 10. Check Backend Health
      - name: Check Backend Health
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🌐 Checking Backend API..."
            curl http://localhost:5000/api/health || echo "Backend not responding"

      # 11. Show Application URL
      - name: Show Application URL
        run: |
          echo "🚀 Application is live at:"
          echo "http://${{ secrets.EC2_IP }}"
